<head>
<meta charset="UTF-8">

<title>NG Tours & Transport System</title>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        collection,
        getDocs,
        deleteDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    /* =========================================================
       FIREBASE CONFIG
       ---------------------------------------------------------
       Paste your Firebase Web App configuration here ONCE.
       ========================================================= */

    const firebaseConfig = {
        apiKey: "PASTE_YOUR_API_KEY",
        authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
        projectId: "PASTE_YOUR_PROJECT_ID",
        storageBucket: "PASTE_YOUR_PROJECT.firebasestorage.app",
        messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
        appId: "PASTE_YOUR_APP_ID"
    };

    let firebaseReady = false;
    let app, auth, db;

    if (
        firebaseConfig.apiKey !== "PASTE_YOUR_API_KEY" &&
        firebaseConfig.projectId !== "PASTE_YOUR_PROJECT_ID"
    ) {
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            firebaseReady = true;
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }
    }

    window.firebaseSystem = {
        firebaseReady,
        auth,
        db,
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
        doc,
        setDoc,
        getDoc,
        collection,
        getDocs,
        deleteDoc,
        serverTimestamp
    };

    if (firebaseReady) {
        onAuthStateChanged(auth, user => {
            if (user) {
                window.currentFirebaseUser = user;
                document.dispatchEvent(new Event("firebaseUserReady"));
            }
        });
    }
</script>

<style>
* {
    box-sizing: border-box;
}

:root {
    --primary: #0b1f33;

    --light: #f4f7fb;

}

body {

}

/* ================= LOGIN ================= */

#loginScreen {

}

}

.input {

}

.input:focus {

}

.btn {

}

.btn-primary {

}

.btn-dark {

}

.btn-danger {

}

.btn-success {

/* ================= HOME ================= */

#homeScreen {

}

.toolbar {

.tool select,

.sheet-scroll {

}

table {

}

th,

}

.sheet-footer {

/* ================= MODALS ================= */

.modal {

    inset: 0;

.modal-card {

.modal-actions {

/* ================= MOBILE ================= */

@media(max-width:700px) {

</style>

<script>

/* =========================================================
   GLOBAL APP STATE
========================================================= */

const DEFAULT_COMPANY_NAME =
    "NG Tours & Transport System";

const DEFAULT_ROWS = 30;
const DEFAULT_COLS = 12;

let companyName = DEFAULT_COMPANY_NAME;

let files = {};

let activeFileId = null;

let selectedCell = {
    row: 0,
    col: 0
};

let undoStack = [];
let redoStack = [];

let hasUnsavedChanges = false;


/* =========================================================
   STARTUP
========================================================= */

window.addEventListener("load", () => {

    loadLocalSettings();

    loadLocalFiles();

    renderCompany();

    /*
       Prototype/local mode:
       If Firebase is not configured, use local authentication.
       Firebase mode is activated automatically after config is added.
    */

    if (
        window.firebaseSystem &&
        window.firebaseSystem.firebaseReady
    ) {

        document.addEventListener(
            "firebaseUserReady",
            async () => {
                await loadFilesFromFirebase();
                showHome();
            }
        );

    } else {

        showLogin();

    }

});


/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    message.textContent = "";

    if (!email || !password) {

        message.textContent =
            "Please enter email and password.";

        return;
    }

    /*
       Firebase Login
    */

    if (
        window.firebaseSystem &&
        window.firebaseSystem.firebaseReady
    ) {

        try {

            await window.firebaseSystem
                .signInWithEmailAndPassword(
                    window.firebaseSystem.auth,
                    email,
                    password
                );

            await loadFilesFromFirebase();

            showHome();

        } catch (error) {

            console.error(error);

            message.textContent =
                "Login failed. Check your email and password.";

        }

        return;
    }


    /*
       Local prototype login.

       IMPORTANT:
       For real production security use Firebase Authentication.
    */

    if (
        email === "admin@ngtours.com" &&
        password === "123"
    ) {

        localStorage.setItem(
            "ng_logged_in",
            "true"
        );

        showHome();

    } else {

        message.textContent =
            "Invalid login details.";

    }

}


async function logout() {

    if (hasUnsavedChanges) {

        const confirmExit =
            confirm(
                "You have unsaved changes. Logout anyway?"
            );

        if (!confirmExit) return;

    }

    if (
        window.firebaseSystem &&
        window.firebaseSystem.firebaseReady
    ) {

        try {

            await window.firebaseSystem
                .signOut(
                    window.firebaseSystem.auth
                );

        } catch (e) {
            console.error(e);
        }

    }

    localStorage.removeItem("ng_logged_in");

    activeFileId = null;

    showLogin();

}


/* =========================================================
   SCREEN CONTROL
========================================================= */

function showLogin() {

    document.getElementById("loginScreen")
        .style.display = "flex";

    document.getElementById("homeScreen")
        .style.display = "none";

    document.getElementById("spreadsheetWorkspace")
        .style.display = "none";

}


function showHome() {

    document.getElementById("loginScreen")
        .style.display = "none";

    document.getElementById("homeScreen")
        .style.display = "block";

    document.getElementById("spreadsheetWorkspace")
        .style.display = "none";

    renderFileList();

}


function showSpreadsheet() {

    document.getElementById("loginScreen")
        .style.display = "none";

    document.getElementById("homeScreen")
        .style.display = "none";

    document.getElementById("spreadsheetWorkspace")
        .style.display = "flex";

}


/* =========================================================
   COMPANY SETTINGS
========================================================= */

function loadLocalSettings() {

    const savedName =
        localStorage.getItem(
            "ng_company_name"
        );

    if (savedName) {
        companyName = savedName;
    }

    const logo =
        localStorage.getItem(
            "ng_company_logo"
        );

    if (logo) {

        document.getElementById("companyLogo")
            .src = logo;

        document.getElementById("companyLogo")
            .style.display = "block";

        document.getElementById("loginLogo")
            .src = logo;

        document.getElementById("loginLogo")
            .style.display = "block";

    }

}


function renderCompany() {

    document.getElementById(
        "companyNameDisplay"
    ).textContent = companyName;

    document.getElementById(
        "loginCompanyName"
    ).textContent = companyName;

}


function openSettings() {

    document.getElementById(
        "settingsCompanyName"
    ).value = companyName;

    document.getElementById(
        "settingsModal"
    ).style.display = "flex";

}


function closeSettings() {

    document.getElementById(
        "settingsModal"
    ).style.display = "none";

}


function previewLogo(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload = e => {

        const preview =
            document.getElementById(
                "logoPreview"
            );

        preview.src = e.target.result;
        preview.style.display = "block";

    };

    reader.readAsDataURL(file);

}


function saveSettings() {

    const name =
        document.getElementById(
            "settingsCompanyName"
        ).value.trim();

    if (name) {

        companyName = name;

        localStorage.setItem(
            "ng_company_name",

        );

    }

    const logo =

        ).src;

    ) {

            logo
        );

        document.getElementById(
            "companyLogo"
        ).src = logo;

        document.getElementById(
            "companyLogo"
        ).style.display = "block";

        document.getElementById(
            "loginLogo"
        ).src = logo;

        document.getElementById(
            "loginLogo"
        ).style.display = "block";

    }

}


/* =========================================================
   FILE SYSTEM
   ========================================================= */

function loadLocalFiles() {

    const data =
        localStorage.getItem(
            "ng_accounting_files"
        );

    if (data) {

        try {
            files = JSON.parse(data);
        } catch {
            files = {};
        }

    }

}


function saveLocalFiles() {

    localStorage.setItem(
        "ng_accounting_files",
        JSON.stringify(files)
    );

}


function openNewFileModal() {

    document.getElementById(
        "newFileModal"
    ).style.display = "flex";

    setTimeout(() => {

        document.getElementById(
            "newFileName"
        ).focus();

    }, 100);

}


function closeNewFileModal() {

    document.getElementById(
        "newFileModal"
    ).style.display = "none";

    document.getElementById(
        "newFileName"
    ).value = "";

}


function newFileKey(event) {

    if (event.key === "Enter") {
        createFile();
    }

}


function createFile() {

    const name =
        document.getElementById(
            "newFileName"
        ).value.trim();

    if (!name) {

        alert("Please enter a file name.");

        return;
    }

    const id =
        "file_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2, 8);

    files[id] = {

        id: id,

        name: name,

        createdAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString(),

        rows: DEFAULT_ROWS,

        cols: DEFAULT_COLS,

        data: {},

        styles: {}

    };

    saveLocalFiles();

    closeNewFileModal();

    renderFileList();

    /*
       Do NOT automatically open another page/section.
       User explicitly chooses when to open the file.
    */

}


function renderFileList() {

    const container =
        document.getElementById(
            "fileList"
        );

    container.innerHTML = "";

    const ids =
        Object.keys(files);

    if (ids.length === 0) {

        container.innerHTML = `
            <div class="empty-state">
                <div style="font-size:45px;">📁</div>
                <h3>No Accounting Files</h3>
                <p>Create your first accounting file using the New File button.</p>
            </div>
        `;

        return;
    }

    ids.forEach(id => {

        const file = files[id];

        const card =
            document.createElement("div");

        card.className = "file-card";

        const date =
            file.updatedAt
                ? new Date(file.updatedAt)
                    .toLocaleString()
                : "";

        card.innerHTML = `

            <div
                class="file-icon"
                onclick="openFile('${id}')"
            >
                📊
            </div>

            <div
                class="file-name"
                onclick="openFile('${id}')"
            >
                ${escapeHTML(file.name)}
            </div>

            <div class="file-date">
                Last saved: ${date}
            </div>

            <div class="file-actions">

                <button
                    class="btn btn-primary"
                    onclick="openFile('${id}')"
                >
                    Open
                </button>

                <button
                    class="btn btn-light"
                    onclick="renameFile('${id}')"
                >
                    Rename
                </button>

                <button
                    class="btn btn-danger"
                    onclick="deleteFile('${id}')"
                >
                    Delete
                </button>

            </div>
        `;

        container.appendChild(card);

    });

}


function renameFile(id) {

    const file = files[id];

    if (!file) return;

    const newName =
        prompt(
            "Enter new file name:",
            file.name
        );

    if (!newName) return;

    file.name = newName.trim();

    file.updatedAt =
        new Date().toISOString();

    saveLocalFiles();

    renderFileList();

}


async function deleteFile(id) {

    const file = files[id];

    if (!file) return;

    const confirmed =
        confirm(
            `Delete "${file.name}" permanently?`
        );

    if (!confirmed) return;

    delete files[id];

    saveLocalFiles();

    if (
        window.firebaseSystem &&
        window.firebaseSystem.firebaseReady
    ) {

        try {

            const user =
                window.currentFirebaseUser;

            if (user) {

                await window.firebaseSystem
                    .deleteDoc(
                        window.firebaseSystem.doc(
                            window.firebaseSystem.db,
                            "users",
                            user.uid,
                            "files",
                            id
                        )
                    );

            }

        } catch (error) {

            console.error(
                "Firebase delete failed:",
                error
            );

        }

    }

    renderFileList();

}


/* =========================================================
   OPEN FILE
========================================================= */

function openFile(id) {

    if (!files[id]) return;

    activeFileId = id;

    undoStack = [];
    redoStack = [];

    hasUnsavedChanges = false;

    document.getElementById(
        "activeFileName"
    ).textContent =
        files[id].name;

    document.getElementById(
        "unsavedIndicator"
    ).style.display = "none";

    buildSpreadsheet();

    showSpreadsheet();

}


/* =========================================================
   EXIT SPREADSHEET
========================================================= */

function exitSpreadsheet() {

    if (hasUnsavedChanges) {

        const answer =
            confirm(
                "You have unsaved changes. Exit without saving?"
            );

        if (!answer) return;

    }

    activeFileId = null;

    hasUnsavedChanges = false;

    showHome();

}


/* =========================================================
   SPREADSHEET ENGINE
========================================================= */

function columnName(number) {

    let name = "";

    number++;

    while (number > 0) {

        let remainder =
            (number - 1) % 26;

        name =
            String.fromCharCode(
                65 + remainder
            ) + name;

        number =
            Math.floor(
                (number - 1) / 26
            );

    }

    return name;

}


function cellKey(row, col) {

    return row + ":" + col;

}


function buildSpreadsheet() {

    const file =
        files[activeFileId];

    if (!file) return;

    const head =
        document.getElementById(
            "sheetHead"
        );

    const body =
        document.getElementById(
            "sheetBody"
        );

    head.innerHTML = "";
    body.innerHTML = "";

    const headerRow =
        document.createElement("tr");

    const corner =
        document.createElement("th");

    corner.className = "corner";

    headerRow.appendChild(corner);

    for (
        let col = 0;
        col < file.cols;
        col++
    ) {

        const th =
            document.createElement("th");

        th.textContent =
            columnName(col);

        th.dataset.col = col;

        headerRow.appendChild(th);

    }

    head.appendChild(headerRow);


    for (
        let row = 0;
        row < file.rows;
        row++
    ) {

        const tr =
            document.createElement("tr");

        const rowHeader =
            document.createElement("th");

        rowHeader.className =
            "row-header";

        rowHeader.textContent =
            row + 1;

        rowHeader.dataset.row =
            row;

        tr.appendChild(rowHeader);


        for (
            let col = 0;
            col < file.cols;
            col++
        ) {

            const td =
                document.createElement("td");

            td.className = "cell";

            td.contentEditable = "true";

            td.dataset.row = row;
            td.dataset.col = col;

            const key =
                cellKey(row, col);

            if (
                file.data &&
                file.data[key] !== undefined
            ) {

                td.textContent =
                    file.data[key];

            }

            applyCellStyle(
                td,
                file.styles
                    ? file.styles[key]
                    : null
            );


            td.addEventListener(
                "focus",
                () => {

                    selectCell(
                        row,
                        col
                    );

                }
            );


            td.addEventListener(
                "input",
                () => {

                    markUnsaved();

                    updateFormulaBar();

                }
            );


            td.addEventListener(
                "keydown",
                sheetKeyDown
            );


            td.addEventListener(
                "paste",
                handlePaste
            );


            tr.appendChild(td);

        }

        body.appendChild(tr);

    }

    selectCell(0, 0);

    calculateAllFormulas();

}


/* =========================================================
   CELL SELECTION
========================================================= */

function selectCell(row, col) {

    selectedCell = {
        row,
        col
    };

    document
        .querySelectorAll(".cell.selected")
        .forEach(c =>
            c.classList.remove("selected")
        );

    const cell =
        getCell(row, col);

    if (!cell) return;

    cell.classList.add("selected");

    document.getElementById(
        "selectedCellName"
    ).textContent =
        columnName(col) + (row + 1);

    updateFormulaBar();

}


function getCell(row, col) {

    return document.querySelector(
        `.cell[data-row="${row}"][data-col="${col}"]`
    );

}


function updateFormulaBar() {

    const cell =
        getCell(
            selectedCell.row,
            selectedCell.col
        );

    if (!cell) return;

    document.getElementById(
        "formulaBar"
    ).value =
        cell.dataset.formula ||
        cell.textContent;

}


/* =========================================================
   FORMULA BAR
========================================================= */

function formulaBarKey(event) {

    if (event.key !== "Enter") return;

    event.preventDefault();

    const value =
        document.getElementById(
            "formulaBar"
        ).value;

    setCellValue(
        selectedCell.row,
        selectedCell.col,
        value
    );

}


function setCellValue(row, col, value) {

    const cell =
        getCell(row, col);

    if (!cell) return;

    if (
        typeof value === "string" &&
        value.startsWith("=")
    ) {

        cell.dataset.formula = value;

    } else {

        delete cell.dataset.formula;

    }

    cell.textContent =
        value;

    markUnsaved();

    calculateAllFormulas();

    updateFormulaBar();

}


/* =========================================================
   FORMULA CALCULATION
========================================================= */

function calculateAllFormulas() {

    const cells =
        document.querySelectorAll(".cell");

    cells.forEach(cell => {

        const formula =
            cell.dataset.formula;

        if (!formula) return;

        try {

            const result =
                evaluateFormula(
                    formula,
                    []
                );

            cell.textContent =
                result;

        } catch (error) {

            cell.textContent =
                "#ERROR!";

        }

    });

}


/*
   Spreadsheet formula support.

   Supported examples:

   =SUM(A1:A10)
   =AVERAGE(A1:A10)
   =MIN(A1:A10)
   =MAX(A1:A10)
   =COUNT(A1:A10)
   =COUNTA(A1:A10)
   =PRODUCT(A1:A5)
   =ABS(A1)
   =ROUND(A1,2)
   =A1+B1
   =A1-B1
   =A1*B1
   =A1/B1
   =IF(A1>100,"Yes","No")
*/

function evaluateFormula(formula, stack) {

    let expression =
        formula.trim();

    if (
        expression.startsWith("=")
    ) {

        expression =
            expression.substring(1);

    }

    expression =
        expression.trim();

    /*
       IF
    */

    const ifMatch =
        expression.match(
            /^IF\s*\((.*)\)$/i
        );

    if (ifMatch) {

        const args =
            splitArguments(
                ifMatch[1]
            );

        if (args.length >= 2) {

            const condition =
                evaluateCondition(
                    args[0],
                    stack
                );

            if (condition) {

                return parseFormulaArgument(
                    args[1],
                    stack
                );

            }

            if (args.length >= 3) {

                return parseFormulaArgument(
                    args[2],
                    stack
                );

            }

            return false;

        }

    }


    /*
       Functions
    */

    const functionMatch =
        expression.match(
            /^([A-Z]+)\s*\((.*)\)$/i
        );

    if (functionMatch) {

        const fn =
            functionMatch[1]
                .toUpperCase();

        const args =
            splitArguments(
                functionMatch[2]
            );

        const values = [];

        args.forEach(arg => {

            if (
                arg.includes(":")
            ) {

                values.push(
                    ...rangeValues(
                        arg,
                        stack
                    )
                );

            } else {

                values.push(
                    parseFormulaArgument(
                        arg,
                        stack
                    )
                );

            }

        });

        switch (fn) {

            case "SUM":
                return values
                    .reduce(
                        (a,b) =>
                            a + toNumber(b),
                        0
                    );

            case "AVERAGE":

                if (!values.length)
                    return 0;

                return values
                    .reduce(
                        (a,b) =>
                            a + toNumber(b),
                        0
                    ) / values.length;

            case "MIN":

                return Math.min(
                    ...values.map(toNumber)
                );

            case "MAX":

                return Math.max(
                    ...values.map(toNumber)
                );

            case "COUNT":

                return values.filter(
                    v =>
                        v !== "" &&
                        !isNaN(Number(v))
                ).length;

            case "COUNTA":

                return values.filter(
                    v =>
                        v !== "" &&
                        v !== null &&
                        v !== undefined
                ).length;

            case "PRODUCT":

                return values.reduce(
                    (a,b) =>
                        a * toNumber(b),
                    1
                );

            case "ABS":

                return Math.abs(
                    toNumber(values[0])
                );

            case "ROUND":

                return Number(
                    toNumber(values[0])
                        .toFixed(
                            Number(values[1] || 0)
                        )
                );

            case "INT":

                return Math.floor(
                    toNumber(values[0])
                );

            case "SQRT":

                return Math.sqrt(
                    toNumber(values[0])
                );

            case "POWER":

                return Math.pow(
                    toNumber(values[0]),
                    toNumber(values[1])
                );

            default:

                throw new Error(
                    "Unknown function"
                );

        }

    }


    /*
       Replace cell references.
    */

    expression =
        expression.replace(
            /\$?([A-Z]{1,3})\$?(\d+)/g,
            (match, colLetters, rowNumber) => {

                const col =
                    lettersToColumn(
                        colLetters
                    );

                const row =
                    Number(rowNumber) - 1;

                const key =
                    cellKey(row, col);

                if (
                    stack.includes(key)
                ) {

                    throw new Error(
                        "Circular reference"
                    );

                }

                const cell =
                    getCell(row, col);

                if (!cell) return "0";

                if (
                    cell.dataset.formula
                ) {

                    const result =
                        evaluateFormula(
                            cell.dataset.formula,
                            [...stack, key]
                        );

                    return JSON.stringify(
                        result
                    );

                }

                const raw =
                    cell.textContent.trim();

                if (
                    raw === ""
                ) {

                    return "0";

                }

                if (
                    !isNaN(Number(raw))
                ) {

                    return raw;

                }

                return JSON.stringify(
                    raw
                );

            }
        );


    /*
       Basic arithmetic.
    */

    if (
        /^[0-9+\-*/().\s%"'<>!=&]+$/.test(
            expression
        )
    ) {

        try {

            return Function(
                `"use strict"; return (${expression})`
            )();

        } catch {}

    }


    /*
       Text.
    */

    if (
        (
            expression.startsWith('"') &&
            expression.endsWith('"')
        ) ||
        (
            expression.startsWith("'") &&
            expression.endsWith("'")
        )
    ) {

        return expression.substring(
            1,
            expression.length - 1
        );

    }

    return expression;

}


function evaluateCondition(condition, stack) {

    const operators = [
        ">=",
        "<=",
        "<>",
        "=",
        ">",
        "<"
    ];

    for (const op of operators) {

        const index =
            condition.indexOf(op);

        if (index !== -1) {

            const left =
                parseFormulaArgument(
                    condition.substring(
                        0,
                        index
                    ),
                    stack
                );

            const right =
                parseFormulaArgument(
                    condition.substring(
                        index + op.length
                    ),
                    stack
                );

            switch (op) {

                case "=":
                    return left == right;

                case "<>":
                    return left != right;

                case ">":
                    return Number(left) > Number(right);

                case "<":
                    return Number(left) < Number(right);

                case ">=":
                    return Number(left) >= Number(right);

                case "<=":
                    return Number(left) <= Number(right);

            }

        }

    }

    return Boolean(
        parseFormulaArgument(
            condition,
            stack
        )
    );

}


function parseFormulaArgument(arg, stack) {

    arg = arg.trim();

    if (
        (
            arg.startsWith('"') &&
            arg.endsWith('"')
        ) ||
        (
            arg.startsWith("'") &&
            arg.endsWith("'")
        )
    ) {

        return arg.substring(
            1,
            arg.length - 1
        );

    }

    if (
        /^[A-Z]{1,3}\d+$/i.test(arg)
    ) {

        const match =
            arg.match(
                /^([A-Z]{1,3})(\d+)$/i
            );

        const col =
            lettersToColumn(
                match[1]
            );

        const row =
            Number(match[2]) - 1;

        const cell =
            getCell(row, col);

        if (!cell) return 0;

        if (cell.dataset.formula) {

            return evaluateFormula(
                cell.dataset.formula,
                [
                    ...stack,
                    cellKey(row,col)
                ]
            );

        }

        return cell.textContent;

    }

    if (
        arg.includes(":")
    ) {

        return rangeValues(
            arg,
            stack
        );

    }

    if (
        !isNaN(Number(arg))
    ) {

        return Number(arg);

    }

    return arg;

}


function rangeValues(range, stack) {

    const match =
        range.trim().match(
            /^([A-Z]+)(\d+):([A-Z]+)(\d+)$/i
        );

    if (!match) {

        return [
            parseFormulaArgument(
                range,
                stack
            )
        ];

    }

    const startCol =
        lettersToColumn(match[1]);

    const startRow =
        Number(match[2]) - 1;

    const endCol =
        lettersToColumn(match[3]);

    const endRow =
        Number(match[4]) - 1;

    const values = [];

    for (
        let r = startRow;
        r <= endRow;
        r++
    ) {

        for (
            let c = startCol;
            c <= endCol;
            c++
        ) {

            const cell =
                getCell(r,c);

            if (!cell) continue;

            if (cell.dataset.formula) {

                values.push(
                    evaluateFormula(
                        cell.dataset.formula,
                        [
                            ...stack,
                            cellKey(r,c)
                        ]
                    )
                );

            } else {

                values.push(
                    cell.textContent
                );

            }

        }

    }

    return values;

}


function lettersToColumn(letters) {

    let result = 0;

    letters =
        letters.toUpperCase();

    for (
        let i = 0;
        i < letters.length;
        i++
    ) {

        result =
            result * 26 +
            (
                letters.charCodeAt(i)
                - 64
            );

    }

    return result - 1;

}


function splitArguments(str) {

    const result = [];

    let current = "";

    let depth = 0;

    let quote = null;

    for (
        let i = 0;
        i < str.length;
        i++
    ) {

        const char = str[i];

        if (
            (
                char === '"' ||
                char === "'"
            )
        ) {

            if (!quote) {
                quote = char;
            } else if (
                quote === char
            ) {
                quote = null;
            }

        }

        if (!quote) {

            if (char === "(")
                depth++;

            if (char === ")")
                depth--;

        }

        if (
            char === "," &&
            depth === 0 &&
            !quote
        ) {

            result.push(
                current.trim()
            );

            current = "";

        } else {

            current += char;

        }

    }

    if (current.trim()) {

        result.push(
            current.trim()
        );

    }

    return result;

}


function toNumber(value) {

    const n =
        Number(value);

    return isNaN(n)
        ? 0
        : n;

}


/* =========================================================
   SHEET KEYBOARD
========================================================= */

function sheetKeyDown(event) {

    const row =
        Number(
            event.currentTarget.dataset.row
        );

    const col =
        Number(
            event.currentTarget.dataset.col
        );

    if (event.key === "Tab") {

        event.preventDefault();

        const nextCol =
            col + 1;

        if (
            nextCol >= files[activeFileId].cols
        ) {

            addColumn();

        }

        selectCell(
            row,
            nextCol
        );

        getCell(
            row,
            nextCol
        ).focus();

    }


    if (event.key === "Enter") {

        event.preventDefault();

        const nextRow =
            row + 1;

        if (
            nextRow >= files[activeFileId].rows
        ) {

            addRow();

        }

        selectCell(
            nextRow,
            col
        );

        getCell(
            nextRow,
            col
        ).focus();

    }


    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "s"
    ) {

        event.preventDefault();

        saveCurrentFile();

    }

}


function handlePaste(event) {

    /*
       Paste tab-separated Excel data.
    */

    event.preventDefault();

    const text =
        event.clipboardData
            .getData("text");

    const rows =
        text.split(/\r?\n/);

    const startRow =
        Number(
            event.currentTarget.dataset.row
        );

    const startCol =
        Number(
            event.currentTarget.dataset.col
        );

    rows.forEach(
        (line, r) => {

            if (!line) return;

            const values =
                line.split("\t");

            values.forEach(
                (value, c) => {

                    const targetRow =
                        startRow + r;

                    const targetCol =
                        startCol + c;

                    ensureGridSize(
                        targetRow,
                        targetCol
                    );

                    setCellValue(
                        targetRow,
                        targetCol,
                        value
                    );

                }
            );

        }
    );

}


/* =========================================================
   DYNAMIC ROWS / COLUMNS
========================================================= */

function ensureGridSize(row, col) {

    const file =
        files[activeFileId];

    if (row >= file.rows) {

        file.rows =
            row + 1;

    }

    if (col >= file.cols) {

        file.cols =
            col + 1;

    }

    buildSpreadsheet();

}


function addRow() {

    const file =
        files[activeFileId];

    if (!file) return;

    file.rows++;

    markUnsaved();

    buildSpreadsheet();

}


function addColumn() {

    const file =
        files[activeFileId];

    if (!file) return;

    file.cols++;

    markUnsaved();

    buildSpreadsheet();

}


function deleteSelectedRow() {

    const file =
        files[activeFileId];

    if (!file) return;

    if (file.rows <= 1) return;

    const row =
        selectedCell.row;

    const newData = {};

    Object.keys(file.data)
        .forEach(key => {

            const parts =
                key.split(":");

            const r =
                Number(parts[0]);

            const c =
                Number(parts[1]);

            if (r === row) return;

            if (r > row) {

                newData[
                    cellKey(r - 1,c)
                ] =
                    file.data[key];

            } else {

                newData[key] =
                    file.data[key];

            }

        });

    file.data =
        newData;

    file.rows--;

    markUnsaved();

    buildSpreadsheet();

}


function deleteSelectedColumn() {

    const file =
        files[activeFileId];

    if (!file) return;

    if (file.cols <= 1) return;

    const col =
        selectedCell.col;

    const newData = {};

    Object.keys(file.data)
        .forEach(key => {

            const parts =
                key.split(":");

            const r =
                Number(parts[0]);

            const c =
                Number(parts[1]);

            if (c === col) return;

            if (c > col) {

                newData[
                    cellKey(r,c - 1)
                ] =
                    file.data[key];

            } else {

                newData[key] =
                    file.data[key];

            }

        });

    file.data =
        newData;

    file.cols--;

    markUnsaved();

    buildSpreadsheet();

}

function saveCurrentCellState() {

    const file =
        files[activeFileId];

    if (!file) return;

    const cell =
        getCell(
            selectedCell.row,
            selectedCell.col
        );

    if (!cell) return;

    const key =
        cellKey(
            selectedCell.row,
            selectedCell.col
        );

    if (!file.styles)
        file.styles = {};

    file.styles[key] = {

        fontWeight:
            cell.style.fontWeight,

        fontStyle:
            cell.style.fontStyle,

        textDecoration:
            cell.style.textDecoration,

        textAlign:
            cell.style.textAlign,

        fontSize:
            cell.style.fontSize,

        color:
            cell.style.color,

        backgroundColor:
            cell.style.backgroundColor

    };

}


function applyCellStyle(cell, style) {

    if (!style) return;

    cell.style.fontWeight =
        style.fontWeight || "";

    cell.style.fontStyle =
        style.fontStyle || "";

    cell.style.textDecoration =
        style.textDecoration || "";

    cell.style.textAlign =

    cell.style.color =
        style.color || "";

    cell.style.backgroundColor =
        style.backgroundColor || "";

}

========================================================= */

function clearCell() {

    const cell =
        getCell(
            selectedCell.row,
            selectedCell.col
        );

    if (!cell) return;

    cell.textContent = "";

    delete cell.dataset.formula;

    saveCurrentCellState();

    markUnsaved();

}


/* =========================================================
   SAVE SYSTEM
========================================================= */

function markUnsaved() {

    hasUnsavedChanges = true;

    document.getElementById(
        "unsavedIndicator"
    ).style.display = "inline";

    document.getElementById(
        "sheetStatus"
    ).textContent =
        "Unsaved changes";

}


function collectSpreadsheetData() {

    const file =
        files[activeFileId];

    if (!file) return;

    file.data = {};

    file.styles = file.styles || {};

    const cells =
        document.querySelectorAll(
            ".cell"
        );

    cells.forEach(cell => {

        const row =
            Number(cell.dataset.row);

        const col =
            Number(cell.dataset.col);

        const key =
            cellKey(row,col);

        const formula =
            cell.dataset.formula;

        const value =
            formula ||
            cell.textContent;

        if (
            value !== ""
        ) {

            file.data[key] =
                value;

        }

        file.styles[key] = {

            fontWeight:
                cell.style.fontWeight,

            fontStyle:
                cell.style.fontStyle,

            textDecoration:
                cell.style.textDecoration,

            textAlign:
                cell.style.textAlign,

            fontSize:
                cell.style.fontSize,

            color:
                cell.style.color,

            backgroundColor:
                cell.style.backgroundColor

        };

    });

}


async function saveCurrentFile() {

    if (!activeFileId) return;

    collectSpreadsheetData();

    const file =
        files[activeFileId];

    file.updatedAt =
        new Date().toISOString();

    /*
       Local copy
    */

    saveLocalFiles();


    /*
       Firebase Save

       IMPORTANT:
       Firebase is written ONLY when
       Save / Ctrl+S is pressed.
    */

    if (
        window.firebaseSystem &&
        window.firebaseSystem.firebaseReady &&
        window.currentFirebaseUser
    ) {

        try {

            const user =
                window.currentFirebaseUser;

            await window.firebaseSystem
                .setDoc(
                    window.firebaseSystem.doc(
                        window.firebaseSystem.db,
                        "users",
                        user.uid,
                        "files",
                        activeFileId
                    ),
                    {
                        id: file.id,
                        name: file.name,
                        rows: file.rows,
                        cols: file.cols,
                        data: file.data,
                        styles: file.styles,
                        updatedAt:
                            window.firebaseSystem
                                .serverTimestamp()
                    }
                );

            document.getElementById(
                "sheetStatus"
            ).textContent =
                "Saved to Firebase";

        } catch (error) {

            console.error(
                "Firebase save failed:",
                error
            );

            document.getElementById(
                "sheetStatus"
            ).textContent =
                "Saved locally - Firebase error";

        }

    } else {

        document.getElementById(
            "sheetStatus"
        ).textContent =
            "Saved locally";

    }


    hasUnsavedChanges = false;

    document.getElementById(
        "unsavedIndicator"
    ).style.display = "none";

}


/* =========================================================
   FIREBASE FILE LOADING
========================================================= */

async function loadFilesFromFirebase() {

    if (
        !window.firebaseSystem ||
        !window.firebaseSystem.firebaseReady
    ) return;

    const user =
        window.currentFirebaseUser;

    if (!user) return;

    try {

        const snapshot =
            await window.firebaseSystem
                .getDocs(
                    window.firebaseSystem.collection(
                        window.firebaseSystem.db,
                        "users",
                        user.uid,
                        "files"
                    )
                );

        files = {};

        snapshot.forEach(docSnap => {

            const data =
                docSnap.data();

            files[data.id] =
                data;

        });

        saveLocalFiles();

    } catch (error) {

        console.error(
            "Could not load Firebase files:",
            error
        );

        loadLocalFiles();

    }

}


/* =========================================================
   CSV EXPORT
========================================================= */

function exportCSV() {

    if (!activeFileId) return;

    collectSpreadsheetData();

    const file =
        files[activeFileId];

    const lines = [];

    for (
        let r = 0;
        r < file.rows;
        r++
    ) {

        const row = [];

        for (
            let c = 0;
            c < file.cols;
            c++
        ) {

            const key =
                cellKey(r,c);

            let value =
                file.data[key] || "";

            value =
                String(value)
                    .replace(/"/g,'""');

            row.push(
                `"${value}"`
            );

        }

        lines.push(
            row.join(",")
        );

    }

    const blob =
        new Blob(
            [lines.join("\n")],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        file.name + ".csv";

    a.click();

    URL.revokeObjectURL(url);

}


/* =========================================================
   UNDO / REDO
========================================================= */

function captureState() {

    collectSpreadsheetData();

    return JSON.stringify(
        files[activeFileId]
    );

}


function restoreState(json) {

    files[activeFileId] =
        JSON.parse(json);

    buildSpreadsheet();

    markUnsaved();

}


function undoAction() {

    if (!undoStack.length) return;

    const current =
        captureState();

    redoStack.push(current);

    const previous =
        undoStack.pop();

    restoreState(previous);

}


function redoAction() {

    if (!redoStack.length) return;

    const current =
        captureState();

    undoStack.push(current);

    const next =
        redoStack.pop();

    restoreState(next);

}
