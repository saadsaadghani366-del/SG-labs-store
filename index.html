<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Tours & Transport System</title>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
:root{--primary:#0b1f33;--accent:#1e88e5;--light:#f4f7fb;--border:#d9e1ea;--danger:#d32f2f;--success:#198754}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:#17212b}
button,input{font:inherit}.hidden{display:none!important}
.screen{min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#071521,#163c5e);padding:20px}
.card{background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:30px;width:410px;max-width:95%}
.card h1{text-align:center;margin:5px 0 8px;font-size:24px}.card p{text-align:center;color:#667788}
.input{width:100%;padding:12px;margin:7px 0;border:1px solid var(--border);border-radius:8px;outline:none}
.input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:8px;padding:10px 15px;cursor:pointer;font-weight:600}
.primary{background:var(--accent);color:#fff}.dark{background:var(--primary);color:#fff}.danger{background:var(--danger);color:#fff}.success{background:var(--success);color:#fff}.light{background:#edf2f7;color:#17212b}
.btn:hover{opacity:.88}.msg{text-align:center;font-size:13px;min-height:20px;margin-top:8px}
.topbar{height:70px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.brand{font-size:19px;font-weight:bold}.sub{font-size:11px;opacity:.7;margin-top:3px}
.container{max-width:1250px;margin:auto;padding:30px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}
.file-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.file-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.file-name{font-weight:bold;font-size:16px;word-break:break-word}.file-date{font-size:11px;color:#788896;margin-top:7px}.actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.empty{text-align:center;color:#778899;padding:70px 20px;grid-column:1/-1}
.workspace{position:fixed;inset:0;background:#fff;z-index:1000;display:none;flex-direction:column}
.sheet-header{height:58px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.toolbar{background:#f4f6f8;border-bottom:1px solid var(--border);padding:7px;display:flex;gap:5px;flex-wrap:wrap}
.tool{border:1px solid #ccd5df;background:#fff;min-width:34px;height:32px;border-radius:5px;cursor:pointer}
.formula{display:flex;height:38px;border-bottom:1px solid var(--border);align-items:center}
.namebox{width:80px;padding:9px;font-weight:bold;background:#f7f9fb;border-right:1px solid var(--border)}
#formulaBar{flex:1;height:100%;border:0;outline:0;padding:8px}
.scroll{flex:1;overflow:auto}
table{border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #d5dce3;min-width:110px;height:28px;padding:4px 7px;white-space:nowrap;overflow:hidden}
th{position:sticky;top:0;background:#eef2f6;z-index:5;text-align:center}
.rowhead{position:sticky;left:0;background:#eef2f6;z-index:6;width:55px;min-width:55px;text-align:center}
.cell{background:#fff;outline:none}.cell.selected{outline:2px solid var(--accent);outline-offset:-2px}
.footer{height:38px;background:#f4f6f8;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-card{width:430px;max-width:92%;background:#fff;border-radius:14px;padding:25px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:700px){.topbar{padding:0 12px}.header{flex-direction:column;align-items:stretch;gap:15px}.container{padding:15px}.toolbar{overflow-x:auto;flex-wrap:nowrap}}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authScreen" class="screen login-wrap">
  <div class="card">
    <h1 id="authTitle">NG Tours & Transport System</h1>
    <p id="authSubtitle">Create an account to continue</p>

    <div id="nameBox">
      <input id="name" class="input" placeholder="Full Name">
    </div>
    <input id="email" class="input" type="email" placeholder="Email Address">
    <input id="password" class="input" type="password" placeholder="Password">
    <input id="confirmPassword" class="input" type="password" placeholder="Confirm Password">

    <button id="authBtn" class="btn primary" style="width:100%;margin-top:8px" onclick="submitAuth()">Create Account</button>
    <div id="authMsg" class="msg"></div>

    <button id="toggleBtn" class="btn light" style="width:100%;margin-top:8px" onclick="toggleAuth()">Already have an account? Login</button>
  </div>
</div>

<!-- HOME -->
<div id="homeScreen" class="hidden">
  <div class="topbar">
    <div>
      <div class="brand">NG Tours & Transport System</div>
      <div class="sub">Accounting Management System</div>
    </div>
    <div style="display:flex;gap:7px">
      <button class="btn light" onclick="openSettings()">Settings</button>
      <button class="btn danger" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="header">
      <div>
        <h2>Accounting Files</h2>
        <div style="font-size:13px;color:#71808e">Create and manage your accounting files.</div>
      </div>
      <button class="btn primary" onclick="openNewFile()">+ New File</button>
    </div>
    <div id="fileList" class="file-list"></div>
  </div>
</div>

<!-- SPREADSHEET -->
<div id="workspace" class="workspace">
  <div class="sheet-header">
    <div>
      <button class="btn light" onclick="exitSpreadsheet()">← Exit</button>
      <span id="activeFileName" style="font-weight:bold;margin-left:10px">Spreadsheet</span>
      <span id="unsaved" style="color:#ffca28;font-size:12px;margin-left:8px;display:none">● Unsaved Changes</span>
    </div>
    <div>
      <button class="btn success" onclick="saveCurrentFile()">Save</button>
      <button class="btn light" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="tool" onclick="format('bold')"><b>B</b></button>
    <button class="tool" onclick="format('italic')"><i>I</i></button>
    <button class="tool" onclick="format('underline')"><u>U</u></button>
    <button class="tool" onclick="align('left')">L</button>
    <button class="tool" onclick="align('center')">C</button>
    <button class="tool" onclick="align('right')">R</button>
    <button class="tool" onclick="addRow()">+ Row</button>
    <button class="tool" onclick="addColumn()">+ Column</button>
    <button class="tool" onclick="deleteRow()">− Row</button>
    <button class="tool" onclick="deleteColumn()">− Column</button>
    <button class="tool" onclick="clearCell()">Clear</button>
  </div>

  <div class="formula">
    <div id="cellName" class="namebox">A1</div>
    <div style="padding:0 10px;font-weight:bold">fx</div>
    <input id="formulaBar" placeholder="Enter value or formula..." onkeydown="formulaKey(event)">
  </div>

  <div class="scroll">
    <table id="sheet"><thead id="head"></thead><tbody id="body"></tbody></table>
  </div>

  <div class="footer">
    <span id="status">Ready</span><span>Ctrl + S = Save</span>
  </div>
</div>

<!-- NEW FILE MODAL -->
<div id="newFileModal" class="modal">
  <div class="modal-card">
    <h3>Create New File</h3>
    <input id="newFileName" class="input" placeholder="Enter file name">
    <div class="modal-actions">
      <button class="btn light" onclick="closeNewFile()">Cancel</button>
      <button class="btn primary" onclick="createFile()">Create File</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal">
  <div class="modal-card">
    <h3>Company Settings</h3>
    <input id="companyNameInput" class="input" placeholder="Company / App Name">
    <div class="modal-actions">
      <button class="btn light" onclick="closeSettings()">Cancel</button>
      <button class="btn primary" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBvm6sWky8M6lYU0N8fFHLFnV_viJhRBZE",
  authDomain: "sg-labs-store.firebaseapp.com",
  databaseURL: "https://sg-labs-store-default-rtdb.firebaseio.com",
  projectId: "sg-labs-store",
  storageBucket: "sg-labs-store.firebasestorage.app",
  messagingSenderId: "84680698655",
  appId: "1:84680698655:web:17b5f7595b2f317cf55e2a",
  measurementId: "G-RC7E0RMX4P"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let loginMode = false;
let currentUser = null;
let files = {};
let activeFileId = null;
let selected = {row:0,col:0};
let rows = 30, cols = 12;
let dirty = false;

const userRoot = () => currentUser ? "users/" + currentUser.uid : null;
const filesRoot = () => userRoot() + "/files";

function toggleAuth(){
  loginMode = !loginMode;
  document.getElementById("authTitle").textContent = loginMode ? "Welcome Back" : "NG Tours & Transport System";
  document.getElementById("authSubtitle").textContent = loginMode ? "Login to continue" : "Create an account to continue";
  document.getElementById("nameBox").classList.toggle("hidden", loginMode);
  document.getElementById("confirmPassword").classList.toggle("hidden", loginMode);
  document.getElementById("authBtn").textContent = loginMode ? "Login" : "Create Account";
  document.getElementById("toggleBtn").textContent = loginMode ? "Create a new account" : "Already have an account? Login";
  document.getElementById("authMsg").textContent = "";
}

async function submitAuth(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const msg = document.getElementById("authMsg");
  msg.textContent = "";
  try{
    if(!email || !password) throw new Error("Please enter email and password.");
    if(!loginMode){
      const name = document.getElementById("name").value.trim();
      const confirm = document.getElementById("confirmPassword").value;
      if(!name) throw new Error("Please enter your name.");
      if(password.length < 6) throw new Error("Password must be at least 6 characters.");
      if(password !== confirm) throw new Error("Passwords do not match.");
      const cred = await auth.createUserWithEmailAndPassword(email,password);
      await db.ref("users/" + cred.user.uid + "/profile").set({
        name, email, createdAt: firebase.database.ServerValue.TIMESTAMP
      });
    }else{
      await auth.signInWithEmailAndPassword(email,password);
    }
  }catch(e){
    msg.textContent = e.message;
  }
}

auth.onAuthStateChanged(async user=>{
  currentUser = user;
  if(user){
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("homeScreen").classList.remove("hidden");
    await loadFiles();
  }else{
    document.getElementById("homeScreen").classList.add("hidden");
    document.getElementById("workspace").style.display="none";
    document.getElementById("authScreen").classList.remove("hidden");
  }
});

async function logout(){
  if(dirty && !confirm("You have unsaved changes. Logout anyway?")) return;
  await auth.signOut();
}

async function loadFiles(){
  const snap = await db.ref(filesRoot()).once("value");
  files = snap.val() || {};
  renderFiles();
}

function renderFiles(){
  const list=document.getElementById("fileList");
  const ids=Object.keys(files);
  if(!ids.length){
    list.innerHTML='<div class="empty">No accounting files yet.<br>Create your first file.</div>';
    return;
  }
  list.innerHTML="";
  ids.sort((a,b)=>(files[b].updatedAt||0)-(files[a].updatedAt||0)).forEach(id=>{
    const f=files[id];
    const card=document.createElement("div");
    card.className="file-card";
    card.innerHTML=`
      <div style="font-size:28px">📊</div>
      <div class="file-name">${escapeHtml(f.name||"Untitled")}</div>
      <div class="file-date">${f.updatedAt?new Date(f.updatedAt).toLocaleString():""}</div>
      <div class="actions">
        <button class="btn primary" onclick="openFile('${id}')">Open</button>
        <button class="btn danger" onclick="deleteFile('${id}')">Delete</button>
      </div>`;
    list.appendChild(card);
  });
}

function openNewFile(){
  document.getElementById("newFileName").value="";
  document.getElementById("newFileModal").style.display="flex";
  setTimeout(()=>document.getElementById("newFileName").focus(),50);
}
function closeNewFile(){document.getElementById("newFileModal").style.display="none"}

async function createFile(){
  const name=document.getElementById("newFileName").value.trim();
  if(!name){alert("Please enter file name.");return}
  const id=db.ref(filesRoot()).push().key;
  const data={name,rows:30,cols:12,cells:{},createdAt:firebase.database.ServerValue.TIMESTAMP,updatedAt:firebase.database.ServerValue.TIMESTAMP};
  await db.ref(filesRoot()+"/"+id).set(data);
  closeNewFile();
  await loadFiles();
  openFile(id);
}

async function deleteFile(id){
  if(!confirm("Delete this accounting file permanently?")) return;
  await db.ref(filesRoot()+"/"+id).remove();
  await loadFiles();
}

function openFile(id){
  activeFileId=id;
  const f=files[id];
  rows=f.rows||30; cols=f.cols||12;
  document.getElementById("activeFileName").textContent=f.name||"Spreadsheet";
  document.getElementById("workspace").style.display="flex";
  selected={row:0,col:0}; dirty=false;
  renderSheet(f.cells||{});
  setStatus("Loaded");
}

function exitSpreadsheet(){
  if(dirty && !confirm("You have unsaved changes. Exit anyway?")) return;
  document.getElementById("workspace").style.display="none";
  activeFileId=null;
}

function renderSheet(saved){
  const head=document.getElementById("head"), body=document.getElementById("body");
  head.innerHTML="<tr><th class='rowhead'>#</th>"+Array.from({length:cols},(_,c)=>`<th>${colName(c)}</th>`).join("")+"</tr>";
  body.innerHTML="";
  for(let r=0;r<rows;r++){
    const tr=document.createElement("tr");
    const rh=document.createElement("td");rh.className="rowhead";rh.textContent=r+1;tr.appendChild(rh);
    for(let c=0;c<cols;c++){
      const td=document.createElement("td");
      td.className="cell";td.contentEditable="true";
      td.dataset.row=r;td.dataset.col=c;
      td.innerHTML=saved[`${r}_${c}`]?.html||"";
      td.addEventListener("click",()=>selectCell(td));
      td.addEventListener("input",()=>{dirty=true;document.getElementById("unsaved").style.display="inline"});
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  selectCell(body.querySelector(".cell"));
}

function selectCell(td){
  document.querySelectorAll(".cell.selected").forEach(x=>x.classList.remove("selected"));
  if(!td)return;
  td.classList.add("selected");
  selected={row:+td.dataset.row,col:+td.dataset.col};
  document.getElementById("cellName").textContent=colName(selected.col)+(selected.row+1);
  document.getElementById("formulaBar").value=td.innerText;
}

function currentCell(){return document.querySelector(`.cell[data-row="${selected.row}"][data-col="${selected.col}"]`)}

function formulaKey(e){
  if(e.key==="Enter"){
    const td=currentCell(); if(td){td.innerText=e.target.value;dirty=true;document.getElementById("unsaved").style.display="inline";td.focus()}
  }
}

function format(cmd){document.execCommand(cmd,false,null);dirty=true}
function align(v){document.execCommand("justify"+v[0].toUpperCase()+v.slice(1),false,null);dirty=true}
function clearCell(){const td=currentCell();if(td){td.innerHTML="";dirty=true}}
function addRow(){rows++;renderSheet(collectCells());dirty=true}
function addColumn(){cols++;renderSheet(collectCells());dirty=true}
function deleteRow(){if(rows>1){rows--;renderSheet(collectCells());dirty=true}}
function deleteColumn(){if(cols>1){cols--;renderSheet(collectCells());dirty=true}}

function collectCells(){
  const out={};
  document.querySelectorAll(".cell").forEach(td=>{
    if(td.innerHTML) out[`${td.dataset.row}_${td.dataset.col}`]={html:td.innerHTML};
  });
  return out;
}

async function saveCurrentFile(){
  if(!activeFileId)return;
  const f=files[activeFileId];
  await db.ref(filesRoot()+"/"+activeFileId).update({
    rows,cols,cells:collectCells(),updatedAt:firebase.database.ServerValue.TIMESTAMP
  });
  dirty=false;document.getElementById("unsaved").style.display="none";
  setStatus("Saved to Firebase");
  await loadFiles();
}

function exportCSV(){
  const lines=[];
  for(let r=0;r<rows;r++){
    const vals=[];
    for(let c=0;c<cols;c++){
      const td=document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
      vals.push('"'+(td?td.innerText.replaceAll('"','""'):"")+'"');
    }
    lines.push(vals.join(","));
  }
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=(files[activeFileId]?.name||"accounting")+".csv";a.click();
  URL.revokeObjectURL(a.href);
}

function openSettings(){
  document.getElementById("companyNameInput").value="NG Tours & Transport System";
  document.getElementById("settingsModal").style.display="flex";
}
function closeSettings(){document.getElementById("settingsModal").style.display="none"}
async function saveSettings(){
  const name=document.getElementById("companyNameInput").value.trim()||"NG Tours & Transport System";
  await db.ref(userRoot()+"/settings").set({companyName:name,updatedAt:firebase.database.ServerValue.TIMESTAMP});
  closeSettings();
  alert("Settings saved to Firebase.");
}

function setStatus(x){document.getElementById("status").textContent=x}
function colName(n){let s="";n++;while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&activeFileId){
    e.preventDefault();saveCurrentFile();
  }
});
</script>
</body>
</html>
