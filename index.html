<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG Labs Store</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #238636;
      --text: #c9d1d9;
      --border: #30363d;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    h1 { margin: 0; color: #58a6ff; font-size: 1.5rem; }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-danger { background: #da3633; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }
    .card h3 { margin: 10px 0 5px; }
    .price { color: #3fb950; font-weight: bold; font-size: 1.1rem; }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border);
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      background: #0d1117;
      border: 1px solid var(--border);
      color: white;
      border-radius: 4px;
      box-sizing: border-box;
    }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <h1>SG Labs Store</h1>
    <button class="btn" onclick="openOwnerPanel()">Owner Panel</button>
  </header>

  <main class="grid" id="productsGrid">
    <p>Loading products...</p>
  </main>

  <!-- Owner Modal -->
  <div class="modal" id="ownerModal">
    <div class="modal-content">
      <h2>Add New Product</h2>
      <input type="text" id="pName" placeholder="Product Name">
      <input type="number" id="pPrice" placeholder="Price (PKR)">
      <input type="text" id="pImg" placeholder="Image URL">
      <textarea id="pDesc" placeholder="Description"></textarea>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn" onclick="addProduct()">Add Product</button>
        <button class="btn btn-danger" onclick="closeOwnerPanel()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      databaseURL: "https://sg-labs-store-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const isOwner = false;

    // Load Products
    database.ref('products').on('value', (snapshot) => {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';
      const data = snapshot.val();
      if (!data) {
        grid.innerHTML = '<p>No products available right now.</p>';
        return;
      }
      for (let id in data) {
        const item = data[id];
        grid.innerHTML += `
          <div class="card">
            <img src="${item.image || 'https://via.placeholder.com/200'}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p style="font-size: 0.9rem; color: #8b949e;">${item.desc || ''}</p>
            <p class="price">Rs. ${item.price}</p>
            ${window.isOwnerAdmin ? `<button class="btn btn-danger" onclick="deleteProduct('${id}')">Delete</button>` : ''}
          </div>
        `;
      }
    });

    function openOwnerPanel() {
      const pin = prompt("Enter Owner PIN:");
      if (pin === "1947") {
        window.isOwnerAdmin = true;
        document.getElementById('ownerModal').style.display = 'flex';
        database.ref('products').once('value', () => {}); // refresh view
      } else if (pin) {
        alert("Incorrect PIN!");
      }
    }

    function closeOwnerPanel() {
      document.getElementById('ownerModal').style.display = 'none';
    }

    function addProduct() {
      const name = document.getElementById('pName').value;
      const price = document.getElementById('pPrice').value;
      const image = document.getElementById('pImg').value;
      const desc = document.getElementById('pDesc').value;

      if (!name || !price) {
        alert("Please enter Name and Price!");
        return;
      }

      database.ref('products').push({
        name, price, image, desc
      }).then(() => {
        closeOwnerPanel();
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pImg').value = '';
        document.getElementById('pDesc').value = '';
      });
    }

    function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        database.ref('products/' + id).remove();
      }
    }
  </script>
</body>
</html>
